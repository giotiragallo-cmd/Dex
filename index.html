<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dex</title>
<style>
  body { font-family: Arial, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; text-align: center; }
  h1 { margin: 8px 0 4px; }
  #stato { color: #888; margin-bottom: 16px; min-height: 20px; }
  #mic { width: 120px; height: 120px; border-radius: 50%; border: none; background: #2a7de1; color: white; font-size: 18px; }
  #mic.attivo { background: #d33; }
  #log { text-align: left; margin-top: 20px; }
  .tu { color: #8cf; margin-top: 12px; }
  .dex { color: #eee; margin-bottom: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Dex</h1>
  <div id="stato">Tocca il pulsante per iniziare a parlare</div>
  <button id="mic">Inizia</button>
  <div id="log"></div>

<script>
  const URL_DEX = 'https://script.google.com/macros/s/AKfycbxfqFBLKuZmFEoeezAarvQem0WWZ8bRWmd6ba4P94-vCmghCiR0UfeaJZVos7GFSZmS/exec';

  const mic = document.getElementById('mic');
  const stato = document.getElementById('stato');
  const log = document.getElementById('log');

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    stato.textContent = 'Riconoscimento vocale non supportato. Usa Chrome.';
  }

  const rec = SR ? new SR() : null;
  if (rec) {
    rec.lang = 'it-IT';
    rec.interimResults = true;   // riceve anche le parole parziali, per l'interruzione
    rec.continuous = false;
  }

  let conversazione = false;   // true quando la conversazione continua e attiva
  let dexParla = false;        // true mentre Dex sta parlando
  let inAttesa = false;        // true mentre aspetta la risposta di Gemini
  let microfonoAperto = false;

  function aggiungi(classe, testo) {
    const d = document.createElement('div');
    d.className = classe;
    d.textContent = testo;
    log.prepend(d);
  }

  function avviaAscolto() {
    if (!conversazione || microfonoAperto || inAttesa) return;
    try {
      rec.start();
      microfonoAperto = true;
      mic.classList.add('attivo');
      stato.textContent = dexParla ? 'Dex parla... puoi interromperlo' : 'Ti ascolto...';
    } catch (e) {}
  }

  function fermaDex() {
    speechSynthesis.cancel();
    dexParla = false;
  }

  function parla(testo) {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(testo.replace(/[*#`]/g, ''));
    u.lang = 'it-IT';
    u.onstart = () => { dexParla = true; };
    u.onend = () => { dexParla = false; avviaAscolto(); };
    u.onerror = () => { dexParla = false; avviaAscolto(); };
    dexParla = true;
    speechSynthesis.speak(u);
    // Mentre Dex parla, riapre il microfono per poter essere interrotto
    setTimeout(avviaAscolto, 300);
  }

  mic.onclick = () => {
    if (!rec) return;
    if (conversazione) {
      // Secondo tocco: ferma tutto
      conversazione = false;
      fermaDex();
      try { rec.stop(); } catch (e) {}
      mic.textContent = 'Inizia';
      mic.classList.remove('attivo');
      stato.textContent = 'Conversazione terminata. Tocca per ricominciare';
    } else {
      conversazione = true;
      mic.textContent = 'Stop';
      avviaAscolto();
    }
  };

  if (rec) {
    rec.onresult = async (e) => {
      const ultimo = e.results[e.results.length - 1];
      const testo = ultimo[0].transcript.trim();

      // Se parli mentre Dex sta rispondendo: lo interrompe subito
      if (dexParla && testo.length > 0) {
        fermaDex();
      }

      if (!ultimo.isFinal) return;   // aspetta la frase completa
      if (testo.length === 0) return;

      inAttesa = true;
      stato.textContent = 'Dex sta pensando...';
      aggiungi('tu', 'Tu: ' + testo);
      try {
        const r = await fetch(URL_DEX + '?q=' + encodeURIComponent(testo));
        const dati = await r.json();
        inAttesa = false;
        aggiungi('dex', 'Dex: ' + dati.risposta);
        if (conversazione) parla(dati.risposta);
      } catch (err) {
        inAttesa = false;
        stato.textContent = 'Errore: ' + err.message;
        aggiungi('dex', 'Errore: ' + err.message);
        avviaAscolto();
      }
    };

    rec.onerror = (e) => {
      microfonoAperto = false;
      mic.classList.remove('attivo');
      if (e.error === 'no-speech' || e.error === 'aborted') {
        setTimeout(avviaAscolto, 300);   // silenzio: riprova
      } else {
        stato.textContent = 'Errore microfono: ' + e.error;
      }
    };

    rec.onend = () => {
      microfonoAperto = false;
      mic.classList.remove('attivo');
      if (conversazione && !inAttesa) setTimeout(avviaAscolto, 200);
    };
  }
</script>
</body>
</html>
